<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Démineur JS</title>
    <link rel="stylesheet" href="/demineur/css/demineur_style.css">
</head>
<body>

<div id="controls">
    <label>Taille (X×X) :
        <input type="number" id="size" value="25" min="5" max="25">
    </label>

    <label>% Mines :
        <input type="number" id="minePercent" value="30" min="5" max="50">
    </label>

    <label> Mines restante:
        <span id="mineCount">0</span>
    </label>

    <label>Mode :
        <select id="mode">
        <option value="mine">Mine</option>
        <option value="flag">Drapeau</option>
        </select>
    </label>



    <button id="start">Lancer la partie</button>
</div>

<div id="game"></div>

<script src="/demineur/js/demineur_script.js"></script>
</body>
</html>
